<title>Card Back · Reliable Solutions VI</title>
<!--
  Reliable Solutions VI — business card BACK (QR side)
  Trim 3.5in x 2in, 0.125in bleed on all sides -> page 3.75in x 2.25in.
  All live content sits inside the 0.125in safe area (0.25in from page edge).
  QR: inlined from assets/qr-vcard.svg (vCard, version 10, 57 modules + 4-module quiet zone).
  Printed size 1.42in incl. quiet zone (modules ~1.24in, ~0.023in / 0.59mm each),
  dark navy modules on a pure-white tile. Do not crop, recolor or place on texture.
-->
<link rel="stylesheet" href="assets/brand.css">
<style>
  :root {
    --ink: #0F172A; --blue: #0369A1; --blue-deep: #075985;
    --sky: #38BDF8; --sky-soft: #7DD3FC; --cream: #EEF3F8; --paper: #F8FAFC;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  @page { size: 3.75in 2.25in; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 3.75in; height: 2.25in; background: var(--ink); }
  body {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    font-family: var(--sans); color: var(--paper);
    -webkit-font-smoothing: antialiased;
  }

  /* Full-bleed background (extends into the 0.125in bleed) */
  .card {
    position: relative; width: 3.75in; height: 2.25in; overflow: hidden;
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(3,105,161,.55) 0%, rgba(3,105,161,0) 55%),
      linear-gradient(160deg, #0F172A 0%, #0B1324 100%);
  }
  /* faint network-node motif, kept to the right so it never touches the QR tile */
  .motif { position: absolute; right: -0.15in; bottom: -0.2in; width: 1.6in; height: 1.6in; opacity: .09; }

  /* Safe area: 0.125in bleed + 0.125in safety = 0.25in from page edge */
  .safe {
    position: absolute; inset: 0.25in;
    display: flex; align-items: center; gap: 0.2in;
  }

  /* QR tile: white, quiet zone fully inside the SVG; tile adds a small extra white margin */
  .qr-tile {
    flex: none; width: 1.5in; height: 1.5in; padding: 0.04in;
    background: #FFFFFF; border-radius: 0.07in;
    box-shadow: 0 0 0 0.012in rgba(56,189,248,.35);
  }
  .qr-tile svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }

  .cta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 0.05in; margin-bottom: 0.08in; }
  .brand svg { width: 0.2in; height: 0.2in; flex: none; }
  .brand span {
    font-family: var(--mono); font-size: 6.5pt; font-weight: 500; letter-spacing: .12em;
    text-transform: uppercase; color: var(--sky-soft); line-height: 1.25;
  }
  h1 {
    font-family: var(--serif); font-weight: 500; font-size: 14pt; line-height: 1.02;
    letter-spacing: -0.01em; color: #FFFFFF;
  }
  h1 em { font-style: italic; font-weight: 400; color: var(--sky); }
  .how {
    margin-top: 0.06in; font-size: 6.6pt; line-height: 1.36; color: rgba(238,243,248,.86);
  }
  .rule { height: 0.01in; width: 0.35in; background: var(--sky); margin: 0.08in 0 0.06in; border-radius: 1px; }
  .fallback-label {
    font-family: var(--mono); font-size: 6.5pt; letter-spacing: .14em; text-transform: uppercase;
    color: var(--sky-soft);
  }
  .phone {
    margin-top: 0.02in; font-family: var(--mono); font-weight: 700; font-size: 10.5pt;
    letter-spacing: .01em; color: #FFFFFF; white-space: nowrap;
  }
  .loc { margin-top: 0.03in; font-size: 6.5pt; color: rgba(238,243,248,.82); letter-spacing: .01em; }

  @media screen {
    html, body { width: auto; height: auto; min-height: 100vh; }
    body { display: grid; place-items: center; background: #1E293B; }
    body.render { display: block; min-height: 0; background: var(--ink); }
  }
</style>
</head>
